name: Verify and reproduce analysis
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: make reproduce
        env:
          MPLCONFIGDIR: /tmp/gemma-matplotlib
